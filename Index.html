<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Draw from JSON</title>
<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    canvas {
        border: 1px solid #444;
        background: black;
    }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="800"></canvas>

<script>
async function drawFromJson(jsonFile) {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Cargar JSON
    const response = await fetch(jsonFile);
    const regions = await response.json();

    // Extraer todos los puntos
    const allPoints = regions.flatMap(r => r.contour.map(p => ({x: p[0], y: p[1]})));

    const min_x = Math.min(...allPoints.map(p => p.x));
    const max_x = Math.max(...allPoints.map(p => p.x));
    const min_y = Math.min(...allPoints.map(p => p.y));
    const max_y = Math.max(...allPoints.map(p => p.y));

    // Calcular escala y centro
    const width = max_x - min_x;
    const height = max_y - min_y;

    const scale = Math.min(600 / width, 600 / height);
    const center_x = (min_x + max_x) / 2;
    const center_y = (min_y + max_y) / 2;

    // Limpiar canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Centrar el dibujo
    ctx.translate(canvas.width / 2, canvas.height / 2);

    // Dibujar regiones
    regions.forEach(region => {
        const color = `rgb(${region.color[0]}, ${region.color[1]}, ${region.color[2]})`;
        ctx.fillStyle = color;
        ctx.strokeStyle = color;

        ctx.beginPath();

        // Primer punto
        let p0 = region.contour[0];
        ctx.moveTo((p0[0] - center_x) * scale, -(p0[1] - center_y) * scale);

        // Resto de puntos
        for (let i = 1; i < region.contour.length; i++) {
            let p = region.contour[i];
            ctx.lineTo((p[0] - center_x) * scale, -(p[1] - center_y) * scale);
        }

        // Cerrar forma
        ctx.closePath();
        ctx.fill();
    });
}

drawFromJson("resources/sunflowers.json");
</script>

</body>
  </html>
