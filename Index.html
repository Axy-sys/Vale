<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valerie florece</title>
  <style>
    html, body { height: 100%; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 232, 142, .22), transparent 24rem),
        linear-gradient(180deg, #091a2f 0%, #18385a 70%, #0b1d16 100%);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .scene {
      position: relative;
      width: min(92vw, 760px);
      height: min(92vh, 760px);
      filter: drop-shadow(0 22px 24px rgba(0, 0, 0, .35));
    }

    svg { width: 100%; height: 100%; display: block; }

    .name {
      position: absolute;
      left: 50%;
      bottom: 2.5%;
      transform: translateX(-50%);
      margin: 0;
      white-space: nowrap;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .02em;
      color: #fff4a8;
      text-shadow:
        0 2px 0 #c99a28,
        0 0 12px rgba(255, 221, 92, .9),
        0 0 32px rgba(255, 196, 52, .65);
      animation: nameGlow 3s ease-in-out infinite alternate;
    }

    .name::before,
    .name::after {
      content: "✦";
      position: absolute;
      top: 45%;
      color: #ffd95a;
      font-size: .24em;
      text-shadow: 0 0 12px #fff;
      animation: sparkle 1.8s ease-in-out infinite;
    }
    .name::before { left: -.55em; }
    .name::after { right: -.55em; animation-delay: .9s; }

    .branch {
      stroke: #5a351f;
      stroke-width: 16;
      stroke-linecap: round;
      fill: none;
      transform-origin: 380px 650px;
      animation: sway 4.8s ease-in-out infinite alternate;
    }
    .branch.thin { stroke-width: 9; animation-duration: 5.6s; }

    .flower {
      transform-box: fill-box;
      transform-origin: center;
      animation: bloom 2.8s cubic-bezier(.2,.7,.2,1) both, swayFlower 4s ease-in-out infinite alternate;
    }
    .flower:nth-child(3n) { animation-delay: .15s, .4s; }
    .flower:nth-child(3n + 1) { animation-delay: .45s, .9s; }

    .petal { fill: #ffc928; stroke: #e6a612; stroke-width: 2; }
    .center { fill: #7a4517; }
    .dot { fill: #d08a1c; }

    .leaf {
      fill: #2f7a3f;
      stroke: #174d2b;
      stroke-width: 3;
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: leafSway 3.8s ease-in-out infinite alternate;
    }

    .firefly {
      fill: #fff39a;
      filter: drop-shadow(0 0 6px #ffe56b);
      animation: float 5s ease-in-out infinite alternate;
    }

    @keyframes sway { to { transform: rotate(1.5deg); } }
    @keyframes swayFlower { to { transform: rotate(5deg) scale(1.04); } }
    @keyframes leafSway { to { transform: rotate(8deg); } }
    @keyframes bloom {
      0% { opacity: 0; transform: scale(.05) rotate(-20deg); }
      65% { transform: scale(1.12) rotate(3deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes nameGlow {
      from { filter: drop-shadow(0 0 4px rgba(255, 229, 96, .4)); }
      to { filter: drop-shadow(0 0 16px rgba(255, 229, 96, .9)); }
    }
    @keyframes sparkle {
      50% { opacity: .25; transform: scale(.55) rotate(90deg); }
    }
    @keyframes float {
      to { transform: translate(18px, -28px); opacity: .35; }
    }
  </style>
</head>
<body>

          </g><circle class="center" r="20"/><circle class="dot" cx="-7" cy="-6" r="3"/><circle class="dot" cx="7" cy="-4" r="3"/><circle class="dot" cx="-2" cy="8" r="3"/>

        </g>

        </g>

          <g><ellipse class="petal" cy="-20" rx="13" ry="24"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(60)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(120)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(180)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(240)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(300)"/></g><circle class="center" r="15"/>
        </g>
        <g class="flower" transform="translate(220 420) scale(.85)">
          <g><ellipse class="petal" cy="-20" rx="13" ry="24"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(60)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(120)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(180)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(240)"/><ellipse class="petal" cy="-20" rx="13" ry="24" transform="rotate(300)"/></g><circle class="center" r="15"/>

      <circle class="firefly" cx="125" cy="220" r="4"/>
      <circle class="firefly" cx="635" cy="280" r="3" style="animation-delay:-2s"/>
      <circle class="firefly" cx="590" cy="160" r="3" style="animation-delay:-3.5s"/>
      <ellipse cx="380" cy="682" rx="190" ry="24" fill="#07120d" opacity=".55"/>
